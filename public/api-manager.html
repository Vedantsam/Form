<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Manager - CRUD Operations</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .api-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            background: #f5f5f5;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .crud-section {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-top: 20px;
        }

        .form-panel {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            height: fit-content;
        }

        .data-panel {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .data-list {
            display: grid;
            gap: 15px;
        }

        .data-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }

        .data-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .data-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .data-card-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .data-card-actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .data-card-body {
            color: #666;
            line-height: 1.6;
        }

        .data-card-body p {
            margin: 8px 0;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-success {
            background: #27ae60;
            color: white;
        }

        .badge-warning {
            background: #f39c12;
            color: white;
        }

        .badge-info {
            background: #3498db;
            color: white;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .status-select {
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🚀 API Manager</h1>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/api-manager.html">API Manager</a>
            <a href="/dashboard">Dashboard</a>
        </div>
    </div>

    <div class="api-container">
        <h1 style="color: #333; margin-bottom: 10px;">CRUD Operations Interface</h1>
        <p style="color: #666; margin-bottom: 30px;">Manage registrations and contacts through RESTful API</p>

        <div class="alert" id="alertMessage"></div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('registrations')">📝 Registrations</button>
            <button class="tab" onclick="switchTab('contacts')">📧 Contacts</button>
        </div>

        <!-- Registrations Tab -->
        <div id="registrations-tab" class="tab-content active">
            <div class="crud-section">
                <div class="form-panel">
                    <h2 style="color: #333; margin-bottom: 20px;">Registration Form</h2>
                    <form id="registrationForm" onsubmit="handleRegistrationSubmit(event)">
                        <input type="hidden" id="registrationId" name="id">
                        
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" id="regFullName" name="fullName" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" id="regEmail" name="email" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="regPhone" name="phone" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>Country *</label>
                            <select id="regCountry" name="country" class="form-control" required>
                                <option value="">Select Country</option>
                                <option value="us">United States</option>
                                <option value="uk">United Kingdom</option>
                                <option value="ca">Canada</option>
                                <option value="in">India</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Gender</label>
                            <select id="regGender" name="gender" class="form-control">
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Bio</label>
                            <textarea id="regBio" name="bio" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="btn-group">
                            <button type="submit" class="btn btn-primary" id="regSubmitBtn">Create</button>
                            <button type="button" class="btn btn-secondary" onclick="resetRegistrationForm()">Reset</button>
                        </div>
                    </form>
                </div>

                <div class="data-panel">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2 style="color: #333; margin: 0;">All Registrations</h2>
                        <button class="btn btn-primary" onclick="loadRegistrations()">🔄 Refresh</button>
                    </div>

                    <div class="search-box">
                        <input type="text" id="regSearch" placeholder="Search registrations..." onkeyup="filterRegistrations()">
                    </div>

                    <div id="registrationsList" class="data-list">
                        <div class="loading">Loading registrations...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Contacts Tab -->
        <div id="contacts-tab" class="tab-content">
            <div class="crud-section">
                <div class="form-panel">
                    <h2 style="color: #333; margin-bottom: 20px;">Contact Form</h2>
                    <form id="contactForm" onsubmit="handleContactSubmit(event)">
                        <input type="hidden" id="contactId" name="id">
                        
                        <div class="form-group">
                            <label>Name *</label>
                            <input type="text" id="contactName" name="name" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" id="contactEmail" name="email" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Subject</label>
                            <input type="text" id="contactSubject" name="subject" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>Message *</label>
                            <textarea id="contactMessage" name="message" class="form-control" rows="4" required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Status</label>
                            <select id="contactStatus" name="status" class="form-control">
                                <option value="pending">Pending</option>
                                <option value="reviewed">Reviewed</option>
                                <option value="responded">Responded</option>
                            </select>
                        </div>

                        <div class="btn-group">
                            <button type="submit" class="btn btn-primary" id="contactSubmitBtn">Create</button>
                            <button type="button" class="btn btn-secondary" onclick="resetContactForm()">Reset</button>
                        </div>
                    </form>
                </div>

                <div class="data-panel">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2 style="color: #333; margin: 0;">All Contacts</h2>
                        <button class="btn btn-primary" onclick="loadContacts()">🔄 Refresh</button>
                    </div>

                    <div class="search-box">
                        <input type="text" id="contactSearch" placeholder="Search contacts..." onkeyup="filterContacts()">
                    </div>

                    <div id="contactsList" class="data-list">
                        <div class="loading">Loading contacts...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/api-manager.js"></script>
</body>
</html>
